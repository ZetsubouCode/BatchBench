<div class="card p-4">
  <form method="post" data-tool-label="CLIP Token Check" data-no-busy="true" id="clip-token-form">
    <input type="hidden" name="tool" value="clip_tokens">
    <div class="row g-3">
      <div class="col-md-8">
        <label class="form-label">Dataset Folder</label>
        <div class="input-group">
          <input
            id="folder_clip_tokens"
            name="folder_clip_tokens"
            type="text"
            class="form-control"
            placeholder="D:\path\to\dataset"
            data-path-role="dataset"
            data-bs-toggle="tooltip"
            data-bs-title="Root folder to scan image + paired .txt captions"
          >
          <button
            class="btn btn-outline-light btn-browse"
            type="button"
            data-target="folder_clip_tokens"
            data-bs-toggle="tooltip"
            data-bs-title="Browse folders"
          >Browse</button>
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label">Image Extensions (comma)</label>
        <input
          name="exts_clip_tokens"
          class="form-control"
          value=".jpg,.jpeg,.png,.webp"
          data-bs-toggle="tooltip"
          data-bs-title="Only images with these extensions are scanned"
        >
      </div>
      <div class="col-md-4">
        <label class="form-label">Token Limit</label>
        <input
          name="limit_clip_tokens"
          type="number"
          min="1"
          class="form-control"
          value="77"
        >
      </div>
      <div class="col-md-4">
        <label class="form-label">Top N</label>
        <input
          name="topn_clip_tokens"
          type="number"
          min="1"
          class="form-control"
          value="20"
        >
      </div>
      <div class="col-md-4">
        <label class="form-label">Mode</label>
        <select name="mode_clip_tokens" class="form-select">
          <option value="estimate" selected>estimate</option>
          <option value="exact">exact</option>
        </select>
        <div class="form-text">Exact mode needs `transformers` and a CLIP tokenizer.</div>
      </div>
      <div class="col-md-12">
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="recursive_clip_tokens" name="recursive_clip_tokens" checked>
          <label class="form-check-label" for="recursive_clip_tokens">Recursive scan</label>
        </div>
        <div class="form-check form-check-inline">
          <input class="form-check-input" type="checkbox" id="include_temp_clip_tokens" name="include_temp_clip_tokens">
          <label class="form-check-label" for="include_temp_clip_tokens">Include `_temp`</label>
        </div>
      </div>
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit" id="clip-token-scan">Scan captions</button>
    </div>
  </form>
</div>
<section class="card p-3 mt-3 d-none" id="clip-token-results" aria-live="polite">
  <h3 class="h6">Caption token results</h3>
  <div class="small mb-2" id="clip-token-summary"></div>
  <div class="row g-3">
    <div class="col-lg-4"><h4 class="h6">Over limit</h4><div id="clip-token-over"></div></div>
    <div class="col-lg-4"><h4 class="h6">Near limit</h4><div id="clip-token-near"></div></div>
    <div class="col-lg-4"><h4 class="h6">Longest captions</h4><div id="clip-token-longest"></div></div>
  </div>
</section>
<script>
(() => {
  const form = document.getElementById('clip-token-form');
  if (!form) return;
  function renderList(id, items, folder) {
    const wrap = document.getElementById(id); wrap.replaceChildren();
    if (!items.length) { wrap.textContent = 'None found.'; return; }
    items.forEach(item => {
      const row = document.createElement('div'); row.className = 'border-top py-2 small';
      const title = document.createElement('div'); title.className = 'fw-semibold'; title.textContent = `${item.token_count} · ${item.file}`;
      const excerpt = document.createElement('div'); excerpt.className = 'text-muted'; excerpt.textContent = item.preview;
      const link = document.createElement('a'); link.className = 'btn btn-sm btn-outline-info mt-1'; link.textContent = 'Open caption';
      link.href = '/?' + new URLSearchParams({tab:'health', dataset:folder, caption:item.file});
      row.append(title, excerpt, link); wrap.appendChild(row);
    });
  }
  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = document.getElementById('clip-token-scan'); button.disabled = true; button.textContent = 'Scanning captions…';
    const payload = Object.fromEntries(new FormData(form));
    payload.recursive_clip_tokens = document.getElementById('recursive_clip_tokens').checked;
    payload.include_temp_clip_tokens = document.getElementById('include_temp_clip_tokens').checked;
    try {
      const response = await fetch('/api/clip-tokens/scan', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      const data = await response.json();
      if (!response.ok || !data.ok) throw new Error(data.error || 'Token scan failed.');
      const top = Number(form.querySelector('[name="topn_clip_tokens"]').value || 20);
      const near = Math.ceil(data.limit * .9);
      renderList('clip-token-over', data.offenders.filter(item => item.token_count > data.limit).slice(0, top), data.folder);
      renderList('clip-token-near', data.offenders.filter(item => item.token_count >= near && item.token_count <= data.limit).slice(0, top), data.folder);
      renderList('clip-token-longest', data.offenders.slice(0, top), data.folder);
      document.getElementById('clip-token-summary').textContent = `${data.scanned_captions} captions scanned · ${data.over_limit} over ${data.limit} tokens · ${data.mode_used} count${data.mode_requested === 'exact' && data.mode_used !== 'exact' ? ' (exact tokenizer unavailable)' : ''}.`;
      document.getElementById('clip-token-results').classList.remove('d-none');
    } catch (error) { document.getElementById('clip-token-results').classList.remove('d-none'); document.getElementById('clip-token-summary').textContent = error.message; }
    finally { button.disabled = false; button.textContent = 'Scan captions'; }
  });
})();
</script>
